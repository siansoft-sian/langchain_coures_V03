# Runs on GitHub every time you push or open a pull request.
# See the results in the "Actions" tab of the repository.

name: Check

on:
  push:
  pull_request:

# The checks only read the code, so give them read-only access
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"

      - name: Install packages
        run: uv sync --locked

      - name: Check code style (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests (pytest)
        run: uv run pytest

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so old commits are scanned too

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Scan every commit for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: python3 CI_Docker_DEV_GUID_COMMAND/docker/build_image.py
