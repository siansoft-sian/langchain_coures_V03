[project]
name = "langchain-coures-v03"
version = "0.1.0"
description = "bulid-search-agent"
readme = "README.md"
authors = [
    { name = "siansoft", email = "siansoft@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, typos), I: import order,
# UP: newer Python syntax, B: common bug patterns
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ci"]
