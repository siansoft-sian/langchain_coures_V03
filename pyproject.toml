[project]
name = "langchain-coures-v03"
version = "0.1.0"
description = "bulid-search-agent"
readme = "README.md"
authors = [
    { name = "siansoft", email = "siansoft@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

# Lets you run the program with: uv run search-agent
[project.scripts]
search-agent = "search_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# The code lives in src/search_agent/ (uv installs it into .venv)
[tool.uv.build-backend]
module-name = "search_agent"

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "src"] # so Ruff knows search_agent is our own code

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, typos), I: import order,
# UP: newer Python syntax, B: common bug patterns
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["CI_Docker_DEV_GUID_COMMAND/ci"] # search_agent itself is installed by uv
